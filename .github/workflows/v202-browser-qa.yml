name: Motion 404 v2.0.2 Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.25.0

      - name: JavaScript syntax
        run: |
          node --check motion-v2.0.2.js
          node --check sw.js

      - name: Start local GitHub Pages equivalent
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/motion-http.log 2>&1 &
          echo $! > /tmp/motion-http.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          curl --fail --silent http://127.0.0.1:8000/motion-v2.0.2.js > /dev/null

      - name: Click every critical control in Chrome
        run: python tests/browser_v202.py

      - name: Server log on failure
        if: failure()
        run: cat /tmp/motion-http.log || true
