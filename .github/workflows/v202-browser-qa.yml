name: Motion 404 Ultimate v5.4 + Original v2 Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-and-original:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.25.0

      - name: Check Ultimate Studio syntax and tests
        run: npm run check

      - name: Verify original JS syntax and bridge
        run: |
          node --check original-runtime/motion-v2.0.2.js
          node --check original-runtime/ultimate-bridge.js
          node --check original-runtime/sw.js
          test -s original-runtime/index.html

      - name: Build Pages subpath fixture
        run: |
          mkdir -p /tmp/pages/Motion-404
          rsync -a --exclude=.git ./ /tmp/pages/Motion-404/
          python -m http.server 8000 --bind 127.0.0.1 --directory /tmp/pages > /tmp/motion-http.log 2>&1 &
          echo $! > /tmp/motion-http.pid
          sleep 1
          for p in index.html src/app.js src/editor.js service-worker.js original-runtime/index.html original-runtime/motion-v2.0.2.js original-runtime/sw.js; do
            curl --fail --silent "http://127.0.0.1:8000/Motion-404/$p" > /dev/null
          done

      - name: Original v2.0.2 browser controls and offline QA
        env:
          MOTION_LOCAL_URL: http://127.0.0.1:8000/Motion-404/original-runtime/
        run: python original-runtime/tests/browser_release_v202.py

      - name: Logs on failure
        if: failure()
        run: cat /tmp/motion-http.log || true
